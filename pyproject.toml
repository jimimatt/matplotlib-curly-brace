[project]
name = "matplotlib-curly-brace"
version = "v1.2.0"
description = "matplotlib curly brace support"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["matplotlib", "visualization", "plotting", "curly-brace", "annotation", "bracket"]
authors = [
    { name = "高斯羽 博士 (Dr. Gao, Siyu)" }
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
sources = ["src"]

[project.urls]
Homepage = "https://github.com/iruletheworld/matplotlib-curly-brace"
Documentation = "https://matplotlib-curly-brace.readthedocs.io/en/latest/"
Repository = "https://github.com/iruletheworld/matplotlib-curly-brace"
Fork = "https://github.com/jimimatt/matplotlib-curly-brace"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
