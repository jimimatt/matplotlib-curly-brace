[project]
name = "matplotlib-curly-brace"
version = "v1.3.0"
description = "matplotlib curly brace support"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["matplotlib", "visualization", "plotting", "curly-brace", "annotation", "bracket"]
authors = [
    { name = "高斯羽 博士 (Dr. Gao, Siyu)" }
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx-rtd-theme>=3.0.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
sources = ["src"]

[project.urls]
Homepage = "https://github.com/iruletheworld/matplotlib-curly-brace"
Documentation = "https://matplotlib-curly-brace.readthedocs.io/en/latest/"
Repository = "https://github.com/iruletheworld/matplotlib-curly-brace"
Fork = "https://github.com/jimimatt/matplotlib-curly-brace"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = [
    "A",  # flake8-builtins
    "ANN",  # mypy
    "ARG",  # flake8-unused-arguments
    "B",  # Bugbear
    "C4",  # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",  # pycodestyle
    "F",  # Pyflakes
    "FLY",  # flynt
    "FA",  # flake8-fututre-annotations
    "I",  # isort
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",  # pycodestyle
    "C90",  # mccabe
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "src" }, # necessary for relative imports
]
venvPath = "."
venv = ".venv"
